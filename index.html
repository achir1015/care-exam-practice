  steps:[
   {t:"檢查輪椅：煞車、輪胎、腳踏板、安全帶", why:"", key:true},

   {t:"照服員雙腳張開、膝蓋抵住個案患側膝蓋", why:"防止患側膝蓋無力跪倒", key:true},
   {t:"抱住個案腰部（或抓移位腰帶），數 1、2、3 一起站起", why:"利用身體力學：彎膝、背打直"},
   {t:"以健側腳為軸心轉身，慢慢坐入輪椅", why:""},

   {t:"回床時：輪椅一樣停在個案健側", why:"", key:true}
  ],
  points:["永遠記得：輪椅放健側","照服員用腿力不用腰力","移位前跟個案說明，邀請個案出力"],
  mistakes:["忘記踩煞車","輪椅放在患側","沒有確認頭暈就站起","坐太淺、沒繫安全帶"],
 }
];

// ===== 進度儲存（只存在這台手機瀏覽器）=====
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
// 每題的完整步驟 = 共通開始 + 本題操作 + 共通結束
const allSteps = s => [...COMMON_START, ...s.steps, ...COMMON_END];
const doneOf = s => store.get("done_"+s.no, []);

const app = document.getElementById("app");
const q = document.getElementById("q");
const backBtn = document.getElementById("backBtn");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ===== 首頁：題目索引 =====
function renderHome(){
  backBtn.hidden = true;
  app.innerHTML = `
    <p class="intro">點選題目可以看操作步驟、勾選練習，並開啟 Google Drive 上的示範影片和攻略 PDF。</p>
    <div class="list">${STATIONS.map(s=>{
      const n=allSteps(s).length, d=doneOf(s).length;
      return `<button class="card" data-go="${s.no}"><span class="no">${s.no}</span>
        <span style="min-width:0"><b>${esc(s.name)}${s.must?' <span class="chip must">必考</span>':''}</b><span>${esc(s.sub)}・${s.mins} 分鐘</span></span>
        <span class="prog">${d}/${n}</span></button>`}).join("")}</div>
    <h3 class="sec-title">每一題都要做的開始與結束</h3>
    <div class="common"><b>開始</b><ul>${COMMON_START.map(x=>`<li>${esc(x.t)}</li>`).join("")}</ul>
      <b style="display:block;margin-top:10px">結束</b><ul>${COMMON_END.map(x=>`<li>${esc(x.t)}</li>`).join("")}</ul></div>
    <div class="media" style="margin-top:16px">
      <button class="btn p" data-go="00" style="border:0">📖 共通技術：洗手（攻略頁碼）</button>
      <a class="btn p" href="${DRIVE(PDF_ID)}" target="_blank" rel="noopener">📕 完整攻略 PDF</a>
      <a class="btn p" href="${FOLDER}" target="_blank" rel="noopener">📁 全部檔案</a></div>
    <p class="foot">步驟內容依勞動部照顧服務員技能檢定術科常見流程整理，正式評分標準請以當年度技能檢定中心公告與攻略 PDF 為準。攻略頁碼對照《照顧服務員技能檢定學術科完全攻略》。勾選進度只存在這台裝置。</p>`;
}

// ===== 詳細頁：一題 =====
let curTab = "steps";
function renderStation(no){
  backBtn.hidden = false;
  if(no==="00") return renderHandwash();
  const s = STATIONS.find(x=>x.no===no); if(!s) return renderHome();
  app.innerHTML = `
    <div class="d-head"><div class="no">第 ${s.no} 題</div><h2>${esc(s.name)}</h2><p>${esc(s.sub)}</p>
      <div class="meta"><span class="chip">試題編號 ${s.code}</span><span class="chip">測試時間 ${s.mins} 分鐘</span>${s.must?'<span class="chip must">必考題</span>':''}<span class="chip">攻略第 ${s.book[0]}–${s.book[1]} 頁</span></div></div>
    <div class="media">
      ${s.videos.map(([l,id])=>`<a class="btn v" href="${DRIVE(id)}" target="_blank" rel="noopener">▶ ${esc(l)}</a>`).join("")}
      <button class="btn p" data-tab="book" style="border:0">📖 攻略 PDF（第 ${s.book[0]}–${s.book[1]} 頁）</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="steps" aria-selected="${curTab==="steps"}">操作步驟</button>
      <button class="tab" role="tab" data-tab="tips" aria-selected="${curTab==="tips"}">重點與易錯</button>
      <button class="tab" role="tab" data-tab="book" aria-selected="${curTab==="book"}">攻略頁面</button>
    </div>
    <div id="pane"></div>`;
  renderPane(s);
}

function stepList(items, offset, done){
  return `<ol class="steps">${items.map((x,i)=>{const idx=i+offset, ok=done.includes(idx);
    return `<li class="step ${ok?"done":""} ${x.key?"key":""}" data-idx="${idx}">
      <input type="checkbox" id="st${idx}" ${ok?"checked":""} aria-label="完成">
      <label for="st${idx}" style="cursor:pointer"><span class="t">${esc(x.t)}</span>${x.why?`<span class="why">${esc(x.why)}</span>`:""}</label></li>`}).join("")}</ol>`;
}

function renderPane(s){
  const pane = document.getElementById("pane");
  if(curTab==="steps"){
    const done = doneOf(s), n = allSteps(s).length, a=COMMON_START.length, b=a+s.steps.length;
    pane.innerHTML = `
      <div class="bar"><i style="width:${done.length/n*100}%"></i></div>
      <div class="barrow"><span>已練習 ${done.length} / ${n} 步　<span style="color:var(--warn)">▍</span>紅線＝評分關鍵</span><button class="reset" id="rs">重新練習</button></div>
      <div class="phase"><h3>準備工作</h3>${stepList(COMMON_START,0,done)}</div>
      <div class="phase"><h3>操作流程</h3>${stepList(s.steps,a,done)}</div>
      <div class="phase"><h3>結束工作</h3>${stepList(COMMON_END,b,done)}</div>`;
    pane.querySelectorAll(".step input").forEach(cb=>cb.addEventListener("change",e=>{
      const idx=+e.target.closest(".step").dataset.idx; let d=doneOf(s);
      d = e.target.checked ? [...new Set([...d,idx])] : d.filter(x=>x!==idx);
      store.set("done_"+s.no,d); renderPane(s);
    }));
    document.getElementById("rs").onclick=()=>{store.set("done_"+s.no,[]);renderPane(s)};
  } else if(curTab==="book"){
    pane.innerHTML = bookView(s);
  } else {
    pane.innerHTML = `
      <div class="box"><h4>考試重點</h4><ul>${s.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box w"><h4>常見扣分</h4><ul>${s.mistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      ${s.table?`<div class="tbl"><table><thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}`;
  }
}

// ===== 攻略頁面：只顯示該題的開始頁到截止頁 =====
function bookView(st){
  // 公開版不放攻略掃描頁（版權），改成提示頁碼並連到 Drive 上的完整 PDF
  return `<div class="box"><h4>請對照攻略書第 ${st.book[0]}–${st.book[1]} 頁</h4>
    <p style="margin:0 0 10px">《照顧服務員技能檢定學術科完全攻略》的這一段是本題的文字說明，可搭配示範影片一起看。</p>
    <a class="btn p" href="${DRIVE(PDF_ID)}" target="_blank" rel="noopener">📕 開啟完整攻略 PDF（Google Drive）</a></div>`;
}
function renderHandwash(){
  const st = HANDWASH;
  app.innerHTML = `<div class="d-head"><div class="no">每題共通</div><h2>${st.name}</h2>
    <div class="meta"><span class="chip">攻略第 ${st.book[0]}–${st.book[1]} 頁</span></div></div>${bookView(st)}`;
}

// ===== 搜尋：跨所有題目的步驟、重點、易錯 =====
function renderSearch(term){
  backBtn.hidden = false;
  const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const hl = t => esc(t).replace(new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m=>`<mark>${m}</mark>`);
  const hits=[];
  STATIONS.forEach(s=>{
    [...s.steps.map(x=>x.t+(x.why?"｜"+x.why:"")), ...s.points, ...s.mistakes, s.name, s.sub].forEach(t=>{ if(re.test(t)) hits.push({s,t}); re.lastIndex=0; });
  });
  [...COMMON_START,...COMMON_END].forEach(x=>{ if(re.test(x.t)) hits.push({s:null,t:x.t}); re.lastIndex=0; });
  app.innerHTML = `<p class="intro">「${esc(term)}」找到 ${hits.length} 筆</p>
    <div class="list">${hits.map(h=>`<button class="hit" ${h.s?`data-go="${h.s.no}"`:""}><small>${h.s?h.s.no+" "+esc(h.s.name):"每題共通"}</small><br>${hl(h.t)}</button>`).join("") || `<p class="empty">找不到，試試其他關鍵字，例如「健側」「水溫」。</p>`}</div>`;
}

// ===== 路由（用 #s01 這種錨點，可分享直接開某一題）=====
function route(){
  const term = q.value.trim();
  if(term) return renderSearch(term);
  const m = location.hash.match(/^#s(\d\d)$/);
  m ? renderStation(m[1]) : renderHome();
  window.scrollTo(0,0);
}
app.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]"); if(go){ q.value=""; location.hash="s"+go.dataset.go; return; }
  const img = e.target.closest(".pg img"); if(img){ img.parentElement.classList.toggle("zoom"); return; }
  const tab = e.target.closest("[data-tab]");
  if(tab){ curTab=tab.dataset.tab; const m=location.hash.match(/^#s(\d\d)$/); if(m) renderStation(m[1]); if(curTab==="book") document.querySelector(".tabs").scrollIntoView({behavior:"smooth"}); }
});
backBtn.onclick = ()=>{ q.value=""; if(location.hash) location.hash=""; else route(); };
q.addEventListener("input", route);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
